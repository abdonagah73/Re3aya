<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Re3aya</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/signin.css">
</head>
<body>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6">
        <div class="card signin-card shadow p-4">

          <a href="../index.html" class="logo">
            Re<span>3aya</span>
          </a>

          <h1 class="h4 fw-bold text-center mb-1">Create Account</h1>
          <p class="text-muted text-center small mb-4">Join Re3aya for home nursing care</p>

          <form action="../index.html" method="get" class="row g-3">
            <div class="col-12">
              <label for="fullname" class="form-label">Full Name</label>
              <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="col-12 col-md-6">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="col-12 col-md-6">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
            </div>

            <div class="col-12 col-md-6">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>

            <div class="col-12 col-md-6">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm password" required>
            </div>

            <div class="col-12">
              <label for="accountType" class="form-label">Account Type</label>
              <select id="accountType" name="accountType" class="form-select" required>
                <option value="">Select account type</option>
                <option value="patient">Patient / Family</option>
                <option value="nurse">Nurse</option>
              </select>
            </div>

            <div class="col-12 mt-3">
              <button type="submit" class="btn btn-teal w-100 py-2 fw-bold">Create Account</button>
            </div>
          </form>

          <p class="text-center small text-muted mt-3 mb-2">
            Already have an account? <a href="login.html" class="link-teal">Sign In</a>
          </p>

          <div class="text-center">
            <a href="../index.html" class="small text-secondary text-decoration-none">Back to Home</a>
          </div>

        </div>
      </div>
    </div>
  </main>

</body>
</html>
