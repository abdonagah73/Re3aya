<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Re3aya</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card login-card shadow p-4">

          <a href="../index.html" class="logo">
            Re<span>3aya</span>
          </a>

          <h1 class="h4 fw-bold text-center mb-1">Welcome Back</h1>
          <p class="text-muted text-center small mb-4">Sign in to your Re3aya account</p>

          <form action="../index.html" method="get" class="row g-3">
            <div class="col-12">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="col-12">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="col-12 d-flex justify-content-between align-items-center small">
              <div class="form-check mb-0">
                <input type="checkbox" id="remember" name="remember" class="form-check-input">
                <label for="remember" class="form-check-label">Remember Me</label>
              </div>
              <a href="signin.html" class="link-teal">Forgot Password?</a>
            </div>

            <div class="col-12 mt-3">
              <button type="submit" class="btn btn-teal w-100 py-2 fw-bold">Sign In</button>
            </div>
          </form>

          <p class="text-center small text-muted mt-3 mb-2">
            Don't have an account? <a href="signin.html" class="link-teal">Create Account</a>
          </p>

          <div class="text-center">
            <a href="../index.html" class="small text-secondary text-decoration-none">Back to Home</a>
          </div>

        </div>
      </div>
    </div>
  </main>

</body>
</html>
